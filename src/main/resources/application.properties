spring.application.name=sportverse-backend

# JWT (HS256; set JWT_SECRET to a long random value in production, min 32 bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# When allow-all=false, these apply:
sportverse.cors.allowed-origins=https://sportverse.co.in,http://localhost:8083,https://sportverseapp.netlify.app


twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.verification.service.sid=${TWILIO_VERIFICATION_SERVICE_SID}

# MongoDB
mongo.connection-string=${MONGO_CONNECTION_STRING}

# Razorpay Configuration
razorpay.key_id=${RAZORPAY_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET}

# ImageKit Configuration
imagekit.url_endpoint=${IMAGEKIT_URL_ENDPOINT}
imagekit.public_key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private_key=${IMAGEKIT_PRIVATE_KEY}

# WhatsApp Cloud API Configuration
whatsapp.cloud.graph-api-version=v25.0
whatsapp.cloud.phone-number-id=${WHATSAPP_CLOUD_PHONE_NUMBER_ID}
whatsapp.cloud.access-token=${WHATSAPP_CLOUD_ACCESS_TOKEN}
whatsapp.cloud.webhook-verify-token=m61FZCMaeWCKD8QsQw3Q
# Login OTP Cloud API template (Meta Business must approve template name / language / params)
whatsapp.cloud.login-otp-template-name=login_otp_template_v2
whatsapp.cloud.login-otp-template-purpose=Login

logging.level.root=DEBUG
